[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-trader"
version = "0.1.0"
description = "Algorithmic momentum trading system for US stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "yfinance>=0.2,<1.0",
    "pandas>=2.0,<4.0",
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.8,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "integration: requires PostgreSQL",
    "backtest: backtest layer tests",
    "ibkr: IBKR integration tests (future)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["streamlit", "plotly", "plotly.*", "pandas"]
ignore_missing_imports = true
